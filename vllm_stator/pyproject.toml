[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stator-vllm"
version = "0.1.0"
description = "Immutable state extents under vLLM: weights and the KV cache of a prefix in host mappings that servers share"
requires-python = ">=3.10"

[project.entry-points."vllm.general_plugins"]
stator = "stator_vllm:register"

[tool.setuptools]
packages = ["stator_vllm"]
