[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stator-vllm-direct"
version = "0.1.0"
description = "Direct attachment of post-Marlin vLLM weights"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["stator_vllm_direct"]
package-dir = {stator_vllm_direct = "."}
